<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<title>Neeche ki sticky bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="max-width: 640px; margin: 0 auto; padding: 8px 8px 8px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; border-radius: 20px; background: #FFFFFF; border: 1px solid #CDEBDD; box-shadow: 0 16px 40px -14px rgba(6, 35, 26, 0.35); font-family: 'Inter', system-ui, sans-serif; color: #06231A">
  <a href="#switch" style="flex: 1 1 auto; min-width: 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; color: #06231A; text-decoration: none">
    <strong style="display: block; font-size: 15px; font-weight: 800; line-height: 1.25">7 din FREE · No credit card</strong>
    <span style="display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; line-height: 1.3; color: #4A5A53">Dusre portal se switch? Help free</span>
  </a>
  <button type="button" onClick="{{start}}" style="flex: none; min-height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: #007A5C; color: #FFFFFF; font: inherit; font-size: 15.5px; font-weight: 800; white-space: nowrap; cursor: pointer">Shuru karo</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onStart":{"editor":null},"$preview":{"width":640,"height":66}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      start: (e) => { if (typeof this.props.onStart === 'function') this.props.onStart(e); }
    };
  }
}
</script>
</body>
</html>
